[package]
name = "ability-core"
version = "0.2.0"
license = "Apache-2.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
rusqlite = { version = "0.40", features = ["backup", "bundled", "serialize"] }
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
jsonschema = { version = "0.48", default-features = false }
tempfile = "3"
