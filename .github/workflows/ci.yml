name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # reviewed master
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate repository contracts
        run: npm run validate:repository
      - name: Audit committed dependency lockfiles
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
          npm audit --audit-level=high
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust
        run: cargo test --workspace --all-targets --locked
      - name: Install deterministic fake CLIs
        run: |
          cargo build -p ability-radar-fake-cli --locked
          $fakeBin = Join-Path $env:RUNNER_TEMP "ability-radar-fake-bin"
          New-Item -ItemType Directory -Force -Path $fakeBin | Out-Null
          Copy-Item target/debug/ability-radar-fake-cli.exe (Join-Path $fakeBin "codex.exe")
          Copy-Item target/debug/ability-radar-fake-cli.exe (Join-Path $fakeBin "claude.exe")
          "$fakeBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test real coordinator with deterministic fake CLIs
        env:
          ABILITY_RADAR_FAKE_CLI_E2E: "1"
        run: cargo test -p ability-radar --test fake_cli_e2e --locked -- --ignored
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Prove Windows desktop NSIS bundle
        run: npm run tauri -- build --debug --bundles nsis
      - name: Upload exact debug installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ability-radar-windows-debug-nsis
          path: target/debug/bundle/nsis/ability-radar_0.2.2_x64-setup.exe
          if-no-files-found: error
          retention-days: 7

  launcher:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.22.0", "24"]
    steps:
      - name: Check out repository for launcher
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up launcher Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install launcher test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test launcher units
        run: npm run test:launcher
      - name: Test packed launcher
        run: npm run test:launcher:package
      - name: Validate launcher repository contracts
        run: npm run validate:repository
